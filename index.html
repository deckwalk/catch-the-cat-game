<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Cat Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">Catch the Cat! It's so fun and amazing!</h1>
        <h2 class="instructions-title">Game Instructions</h2>
        <p class="instructions">Click on the cat to score points. The cat will move to a random position every second. Try to catch it as many times as you can!</p>     
        <p class="point">Score: <span id="score">0</span></p>
        <img class="github-icon" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSuYIprEvJ5lj-58xOPTE1xD_DBgdbrNhicyg&s" alt="git-hub-icone">
        <div id="cat" class="cat"></div>
        <button id="start-button">Start Game</button>
        <button id="pause-button">Pause Game</button>
        <button id="stop-button">Stop Game</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
