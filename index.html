<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Cat Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container">
    <h1>🐱 Catch the Cat Challenge!</h1>

    <p>Score: <span id="score">0</span></p>
    <p>High Score: <span id="high-score">0</span></p>
    <p>Power-Up: <span id="power-up">None</span></p>

    <div id="cat" class="cat"></div>

    <div class="buttons">
        <button id="start-button">Start Game</button>
        <button id="pause-button" disabled>Pause Game</button>
        <button id="stop-button" disabled>Stop Game</button>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
